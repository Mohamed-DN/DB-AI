# Grafana Datasource Provisioning
# Auto-configures VictoriaMetrics as default datasource for long-term metrics

apiVersion: 1

datasources:
  # VictoriaMetrics - Primary datasource for long-term storage
  - name: VictoriaMetrics
    type: prometheus
    access: proxy
    url: http://victoriametrics:8428
    isDefault: true
    editable: true
    jsonData:
      timeInterval: "15s"
      httpMethod: "POST"

  # Prometheus - For recent/real-time metrics (optional)
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: false
    editable: true
    jsonData:
      timeInterval: "15s"
