# =============================================================================
# NEXI DBA AI - AMBIENTE DI LABORATORIO V2 (SHADOW MODE)
# =============================================================================
# Questo docker-compose crea un ambiente PARALLELO per testare il sistema DBA AI
# Usa variabili d'ambiente dal file .env (o .env.v2 copiato in .env)
# =============================================================================

version: '3.8'

networks:
  nexi-lab2:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16

services:
  # ===========================================================================
  # ORCHESTRATOR - Servizi centrali (V2)
  # ===========================================================================

  # MongoDB - CMDB Database (V2)
  mongodb2:
    image: mongo:7
    container_name: nexi-mongodb2
    hostname: mongodb2.nexi.lab
    ports:
      - "${MONGODB_PORT:-28017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-nexi2024}
      MONGO_INITDB_DATABASE: ${MONGODB_DB:-nexi_cmdb_v2}
    volumes:
      - mongodb_data_v2:/data/db
    networks:
      nexi-lab2:
        ipv4_address: 172.21.0.10
    restart: unless-stopped

  # Mongo Express - Web UI for MongoDB (V2)
  mongo-express2:
    image: mongo-express:latest
    container_name: nexi-mongo-express2
    hostname: mongo-express2.nexi.lab
    ports:
      - "${MONGO_EXPRESS_PORT:-9081}:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USERNAME:-admin}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASSWORD:-nexi2024}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USERNAME:-admin}:${MONGO_PASSWORD:-nexi2024}@mongodb2:27017/
      ME_CONFIG_BASICAUTH: "false"
    networks:
      nexi-lab2:
        ipv4_address: 172.21.0.15
    depends_on:
      - mongodb2
    restart: unless-stopped

  # Redis - Message Queue (V2)
  redis2:
    image: redis:7-alpine
    container_name: nexi-redis2
    hostname: redis2.nexi.lab
    ports:
      - "${REDIS_PORT:-7379}:6379"
    networks:
      nexi-lab2:
        ipv4_address: 172.21.0.11
    restart: unless-stopped

  # Ollama - Local LLM (V2)
  ollama2:
    image: ollama/ollama:latest
    container_name: nexi-ollama2
    hostname: ollama2.nexi.lab
    ports:
      - "${OLLAMA_PORT:-12434}:11434"
    volumes:
      - ollama_data_v2:/root/.ollama
    networks:
      nexi-lab2:
        ipv4_address: 172.21.0.12
    restart: unless-stopped
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [ gpu ]

    # Open WebUI - ChatGPT-like interface for Ollama (V2)
  open-webui2:
    image: ghcr.io/open-webui/open-webui:main
    container_name: nexi-open-webui2
    hostname: open-webui2.nexi.lab
    ports:
      - "${OPEN_WEBUI_PORT:-4001}:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama2:11434
    volumes:
      - open_webui_data_v2:/app/backend/data
    networks:
      nexi-lab2:
        ipv4_address: 172.21.0.16
    depends_on:
      - ollama2
    restart: unless-stopped

  # Qdrant - Vector Database (V2)
  qdrant2:
    image: qdrant/qdrant:latest
    container_name: nexi-qdrant2
    hostname: qdrant2.nexi.lab
    ports:
      - "${QDRANT_PORT:-7333}:6333"
    volumes:
      - qdrant_data_v2:/qdrant/storage
    networks:
      nexi-lab2:
        ipv4_address: 172.21.0.13
    restart: unless-stopped

  # ===========================================================================
  # GATEWAY 1 - Milano (Datacenter Primario) V2
  # ===========================================================================

  gateway-milano2:
    build: ./gateway-ssh
    container_name: nexi-gw-milano2
    hostname: gw-milano2.nexi.lab
    ports:
      - "${GW_MILANO_PORT:-3221}:22"
    networks:
      nexi-lab2:
        ipv4_address: 172.21.1.1
    depends_on:
      - pg-milano-prod2
      - pg-milano-dev2
    restart: unless-stopped

  # PostgreSQL Milano - PROD (V2)
  pg-milano-prod2:
    image: postgres:15
    container_name: nexi-pg-milano-prod2
    hostname: pg-milano-prod2.nexi.lab
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: nexi2024
      POSTGRES_DB: payments_prod
    volumes:
      - pg_milano_prod_data_v2:/var/lib/postgresql/data
    networks:
      nexi-lab2:
        ipv4_address: 172.21.1.10
    restart: unless-stopped

  # PostgreSQL Milano - DEV (V2)
  pg-milano-dev2:
    image: postgres:15
    container_name: nexi-pg-milano-dev2
    hostname: pg-milano-dev2.nexi.lab
    ports:
      - "${PG_MILANO_DEV_PORT:-6433}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: nexi2024
      POSTGRES_DB: payments_dev
    volumes:
      - pg_milano_dev_data_v2:/var/lib/postgresql/data
    networks:
      nexi-lab2:
        ipv4_address: 172.21.1.11
    restart: unless-stopped

  # PostgreSQL Milano - STAGING (V2)
  pg-milano-stg2:
    image: postgres:15
    container_name: nexi-pg-milano-stg2
    hostname: pg-milano-stg2.nexi.lab
    ports:
      - "${PG_MILANO_STG_PORT:-6435}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: nexi2024
      POSTGRES_DB: payments_stg
    volumes:
      - pg_milano_stg_data_v2:/var/lib/postgresql/data
    networks:
      nexi-lab2:
        ipv4_address: 172.21.1.12
    restart: unless-stopped

  # ===========================================================================
  # GATEWAY 2 - Bratislava (Datacenter Secondario) V2
  # ===========================================================================

  gateway-bratislava2:
    build: ./gateway-ssh
    container_name: nexi-gw-bratislava2
    hostname: gw-bratislava2.nexi.lab
    ports:
      - "${GW_BRATISLAVA_PORT:-3222}:22"
    networks:
      nexi-lab2:
        ipv4_address: 172.21.2.1
    depends_on:
      - pg-bratislava-prod2
      - pg-bratislava-dev2
    restart: unless-stopped

  # PostgreSQL Bratislava - PROD (V2)
  pg-bratislava-prod2:
    image: postgres:15
    container_name: nexi-pg-bratislava-prod2
    hostname: pg-bratislava-prod2.nexi.lab
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: nexi2024
      POSTGRES_DB: cards_prod
    volumes:
      - pg_bratislava_prod_data_v2:/var/lib/postgresql/data
    networks:
      nexi-lab2:
        ipv4_address: 172.21.2.10
    restart: unless-stopped

  # PostgreSQL Bratislava - DEV (V2)
  pg-bratislava-dev2:
    image: postgres:15
    container_name: nexi-pg-bratislava-dev2
    hostname: pg-bratislava-dev2.nexi.lab
    ports:
      - "${PG_BRATISLAVA_DEV_PORT:-6434}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: nexi2024
      POSTGRES_DB: cards_dev
    volumes:
      - pg_bratislava_dev_data_v2:/var/lib/postgresql/data
    networks:
      nexi-lab2:
        ipv4_address: 172.21.2.11
    restart: unless-stopped

  # ===========================================================================
  # GATEWAY 3 - Cairo (North Africa Region) V2
  # ===========================================================================

  gateway-cairo2:
    build: ./gateway-ssh
    container_name: nexi-gw-cairo2
    hostname: gw-cairo2.nexi.lab
    ports:
      - "${GW_CAIRO_PORT:-3223}:22"
    networks:
      nexi-lab2:
        ipv4_address: 172.21.3.1
    depends_on:
      - oracle-cairo-primary2
      - oracle-cairo-replica2
    restart: unless-stopped

  # Oracle Cairo - PRIMARY (V2)
  oracle-cairo-primary2:
    image: gvenzl/oracle-free:23-slim
    container_name: nexi-oracle-cairo-primary2
    hostname: oracle-cairo-primary2.nexi.lab
    ports:
      - "${ORACLE_CAIRO_PRIMARY_PORT:-2521}:1521"
    environment:
      ORACLE_PASSWORD: nexi2024
      ORACLE_DATABASE: JUPITER
      APP_USER: nexi_app
      APP_USER_PASSWORD: app2024
    volumes:
      - oracle_cairo_prim_data_v2:/opt/oracle/oradata
    networks:
      nexi-lab2:
        ipv4_address: 172.21.3.10
    restart: unless-stopped

  # Oracle Cairo - REPLICA (GoldenGate Target) V2
  oracle-cairo-replica2:
    image: gvenzl/oracle-free:23-slim
    container_name: nexi-oracle-cairo-replica2
    hostname: oracle-cairo-replica2.nexi.lab
    ports:
      - "${ORACLE_CAIRO_REPLICA_PORT:-2522}:1521"
    environment:
      ORACLE_PASSWORD: nexi2024
      ORACLE_DATABASE: JUPITER
      APP_USER: nexi_app
      APP_USER_PASSWORD: app2024
    volumes:
      - oracle_cairo_repl_data_v2:/opt/oracle/oradata
    networks:
      nexi-lab2:
        ipv4_address: 172.21.3.11
    restart: unless-stopped

  # ===========================================================================
  # OBSERVABILITY - Langfuse LLM Tracing
  # ===========================================================================

  # PostgreSQL for Langfuse
  langfuse-db:
    image: postgres:15-alpine
    container_name: nexi-langfuse-db2
    hostname: langfuse-db.nexi.lab
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse2024
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_db_data_v2:/var/lib/postgresql/data
    networks:
      nexi-lab2:
        ipv4_address: 172.21.0.20
    restart: unless-stopped

  # Langfuse - LLM Observability (V2 - stable, PostgreSQL-only)
  langfuse:
    image: langfuse/langfuse:2
    container_name: nexi-langfuse2
    hostname: langfuse.nexi.lab
    ports:
      - "${LANGFUSE_PORT:-3001}:3000"
    environment:
      # Database
      DATABASE_URL: postgresql://langfuse:langfuse2024@langfuse-db:5432/langfuse
      # Auth
      NEXTAUTH_URL: http://localhost:3001
      NEXTAUTH_SECRET: super-secret-langfuse-key-change-in-prod
      SALT: super-secret-salt-change-in-prod
      # Headless Initialization - Auto-create org, project, user, API keys
      LANGFUSE_INIT_ORG_ID: nexi-org
      LANGFUSE_INIT_ORG_NAME: Nexi DBA
      LANGFUSE_INIT_PROJECT_ID: nexi-dba-ai
      LANGFUSE_INIT_PROJECT_NAME: Nexi DBA AI
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: pk-lf-nexi-dba-ai-v2
      LANGFUSE_INIT_PROJECT_SECRET_KEY: sk-lf-nexi-dba-ai-v2-secret
      LANGFUSE_INIT_USER_EMAIL: admin@nexi.lab
      LANGFUSE_INIT_USER_NAME: Nexi DBA Admin
      LANGFUSE_INIT_USER_PASSWORD: NexiDBA2024!
    depends_on:
      - langfuse-db
    networks:
      nexi-lab2:
        ipv4_address: 172.21.0.21
    restart: unless-stopped

  # ===========================================================================
  # MONITORING - Prometheus + Grafana Stack
  # ===========================================================================

  # Prometheus - Metrics Collection
  prometheus:
    image: prom/prometheus:latest
    container_name: nexi-prometheus2
    hostname: prometheus.nexi.lab
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data_v2:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      nexi-lab2:
        ipv4_address: 172.21.0.30
    restart: unless-stopped

  # Grafana - Dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: nexi-grafana2
    hostname: grafana.nexi.lab
    ports:
      - "${GRAFANA_PORT:-3003}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: NexiGrafana2024!
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_NAME: "Nexi DBA"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_SERVER_ROOT_URL: "http://localhost:3003"
    volumes:
      - grafana_data_v2:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      nexi-lab2:
        ipv4_address: 172.21.0.31
    restart: unless-stopped

  # PostgreSQL Exporter - Metrics for PostgreSQL
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: nexi-pg-exporter2
    hostname: pg-exporter.nexi.lab
    ports:
      - "${PG_EXPORTER_PORT:-9187}:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://nexi_app:app2024@pg-milano-prod2:5432/nexi_prod?sslmode=disable"
    depends_on:
      - pg-milano-prod2
    networks:
      nexi-lab2:
        ipv4_address: 172.21.0.32
    restart: unless-stopped

  # CheckMK Prometheus Exporter - Exports host/service metrics
  checkmk-exporter:
    build:
      context: ../..
      dockerfile: ops/docker-lab/Dockerfile.checkmk-exporter
    container_name: nexi-checkmk-exporter
    hostname: checkmk-exporter.nexi.lab
    ports:
      - "${CHECKMK_EXPORTER_PORT:-9106}:9106"
    environment:
      CHECKMK_URL: "http://checkmk:5000/nexi_monitor/check_mk/api/1.0"
      CHECKMK_USER: cmkadmin
      CHECKMK_PASSWORD: nexi2024
      CHECKMK_EXPORTER_PORT: "9106"
    depends_on:
      - checkmk
    networks:
      nexi-lab2:
        ipv4_address: 172.21.0.34
    restart: unless-stopped

  # ===========================================================================
  # TIME SERIES - VictoriaMetrics for Long-Term Storage
  # ===========================================================================
  # VictoriaMetrics provides:
  # - Long-term storage for Prometheus metrics
  # - 10x better compression than Prometheus
  # - PromQL compatible queries
  # - Horizontal scalability for 3000+ databases

  victoriametrics:
    image: victoriametrics/victoria-metrics:latest
    container_name: nexi-victoriametrics
    hostname: victoriametrics.nexi.lab
    ports:
      - "${VICTORIAMETRICS_PORT:-8428}:8428"
      - "${VICTORIAMETRICS_GRAPHITE_PORT:-2003}:2003"  # Graphite for CheckMK Raw
    volumes:
      - victoriametrics_data:/victoria-metrics-data
    command:
      - '--storageDataPath=/victoria-metrics-data'
      - '--httpListenAddr=:8428'
      - '--graphiteListenAddr=:2003'  # Enable Graphite ingestion for CheckMK
      - '--retentionPeriod=365d'  # 1 year retention
      - '--maxLabelsPerTimeseries=30'
    networks:
      nexi-lab2:
        ipv4_address: 172.21.0.33
    restart: unless-stopped

  # ===========================================================================
  # MONITORING - CheckMK (Simulation)
  # ===========================================================================

  checkmk:
    image: checkmk/check-mk-raw:2.2.0-latest
    container_name: nexi-checkmk
    hostname: checkmk.nexi.lab
    ports:
      - "8080:5000"
      - "8000:8000" # Agent receiver
    networks:
      nexi-lab2:
        ipv4_address: 172.21.0.40
    environment:
      CMK_SITE_ID: nexi_monitor
      CMK_PASSWORD: nexi2024
    volumes:
      - checkmk_data:/omd/sites
    restart: unless-stopped

volumes:
  mongodb_data_v2:
  ollama_data_v2:
  open_webui_data_v2:
  qdrant_data_v2:
  pg_milano_prod_data_v2:
  pg_milano_dev_data_v2:
  pg_milano_stg_data_v2:
  pg_bratislava_prod_data_v2:
  pg_bratislava_dev_data_v2:
  oracle_cairo_prim_data_v2:
  oracle_cairo_repl_data_v2:
  langfuse_db_data_v2:
  langfuse_clickhouse_data_v2:
  prometheus_data_v2:
  grafana_data_v2:
  victoriametrics_data:
  checkmk_data:
