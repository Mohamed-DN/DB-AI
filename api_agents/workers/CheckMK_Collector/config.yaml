# CheckMK Collector Configuration
# ================================
# Questo file configura il collector per supportare sia CheckMK 2.x (REST API)
# che CheckMK 1.5.x (Livestatus / Web API Legacy)

# Impostazioni globali
global:
  poll_interval_seconds: 60
  request_timeout: 30
  max_workers: 5

# MongoDB connection
mongodb:
  uri: "${MONGO_URI:-mongodb://admin:nexi2024@localhost:28017/}"
  database: "${MONGO_DB:-nexi_cmdb_v2}"

# VictoriaMetrics/Graphite connection
metrics:
  graphite_host: "${GRAPHITE_HOST:-localhost}"
  graphite_port: 2003

# CheckMK Instances
# -----------------
# Il collector supporta 3 modalità di comunicazione:
#   - rest_api: CheckMK 2.x REST API (raccomandato)
#   - livestatus: CheckMK 1.x/2.x Livestatus socket
#   - webapi_legacy: CheckMK 1.5.x Web API
#
# Se 'discover_from_mongo' è true, le istanze vengono caricate da MongoDB 'gateways'

discover_from_mongo: true

# Istanze manuali (usate solo se discover_from_mongo è false)
instances:
  # Esempio CheckMK 2.x con REST API
  - name: "milano-datacenter"
    url: "http://cmk-milano:8080"
    site: "nexi_monitor"
    datacenter: "MILANO"
    api_mode: "rest_api" # rest_api | livestatus | webapi_legacy
    api_version: "2.x"
    username: "${CHECKMK_USER:-cmkadmin}"
    password: "${CHECKMK_PASSWORD:-nexi2024}"
    enabled: true

  # Esempio CheckMK 1.5.x con Livestatus (TCP)
  # - name: "legacy-datacenter"
  #   url: "http://cmk-legacy:8080"
  #   site: "nexi_monitor"
  #   datacenter: "LEGACY_DC"
  #   api_mode: "livestatus"
  #   api_version: "1.5.0p16"
  #   livestatus_host: "cmk-legacy"
  #   livestatus_port: 6557
  #   enabled: true

  # Esempio CheckMK 1.5.x con Web API Legacy
  # - name: "old-datacenter"
  #   url: "http://cmk-old:8080"
  #   site: "monitoring"
  #   datacenter: "OLD_DC"
  #   api_mode: "webapi_legacy"
  #   api_version: "1.5.0p16"
  #   username: "automation"
  #   automation_secret: "your-secret-here"
  #   enabled: true
# Schema MongoDB per gateways (se discover_from_mongo: true)
# ----------------------------------------------------------
# Ogni documento gateway deve avere questi campi per CheckMK:
#
# {
#   "_id": "gateway-1",
#   "datacenter": "MILANO",
#   "checkmk_url": "http://cmk-server:8080",
#   "checkmk_site": "nexi_monitor",
#   "checkmk_version": "1.5.0p16",     # Versione installata
#   "checkmk_api_mode": "livestatus",  # rest_api | livestatus | webapi_legacy
#   "checkmk_user": "cmkadmin",
#   "checkmk_password": "secret",
#   "checkmk_livestatus_port": 6557,   # Solo per api_mode: livestatus
#   "hosts": [
#     {"host": "10.0.1.10", "db_unique_name": "DB_PROD_01"},
#     {"host": "10.0.1.11", "db_unique_name": "DB_DEV_01"}
#   ]
# }
