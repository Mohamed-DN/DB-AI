version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: m-dn-cmdb-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-admin123}
      MONGO_INITDB_DATABASE: m-dn_cmdb
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  mongo-express:
    image: mongo-express:latest
    container_name: m-dn-mongo-express
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASSWORD:-admin123}
      ME_CONFIG_MONGODB_URL: mongodb://admin:${MONGO_PASSWORD:-admin123}@mongodb:27017/
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - mongodb
    restart: unless-stopped

  gateway:
    image: lscr.io/linuxserver/openssh-server:latest
    container_name: maesdn-gateway
    hostname: maesdn
    environment:
      - PUID=1000
      - PGID=1000
      - USER_NAME=admin
      - USER_PASSWORD=m-dn
      - PASSWORD_ACCESS=true
    ports:
      - "2244:2222"
    restart: unless-stopped

volumes:
  mongodb_data:
