version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: nexi-cmdb-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-admin123}
      MONGO_INITDB_DATABASE: nexi_cmdb
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  gateway:
    image: lscr.io/linuxserver/openssh-server:latest
    container_name: maesdn-gateway
    hostname: maesdn
    environment:
      - PUID=1000
      - PGID=1000
      - USER_NAME=admin
      - USER_PASSWORD=nexi
      - PASSWORD_ACCESS=true
    ports:
      - "2244:2222"
    restart: unless-stopped

volumes:
  mongodb_data:
