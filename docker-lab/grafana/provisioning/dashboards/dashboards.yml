# Grafana Dashboard Provisioning
# Auto-loads dashboards from JSON files

apiVersion: 1

providers:
  - name: 'Nexi DBA AI'
    orgId: 1
    folder: 'Nexi DBA AI'
    folderUid: 'nexi-dba'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/json
